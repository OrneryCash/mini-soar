# Mini-SOAR configuration
server:
  host: 0.0.0.0
  port: 8080

# Where playbooks (YAML) live — hot-reloaded on change
playbooks_dir: playbooks

# Audit + state storage (SQLite — PDPA defensible log)
data_dir: data
db_path: data/minisoar.db

# Evidence preservation folder
evidence_dir: evidence

# LINE Messaging API (LINE Notify was discontinued 2025-03-31 — dead endpoint).
# Create a LINE Official Account → Messaging API channel → get channel access token
# + the recipient's user ID (LINE Notify-style per-user tokens no longer exist).
# Empty token/user-id = notifications are simulated (logged + shown in UI)
# so the demo works without a LINE account.
line_channel_token: ""
line_target_user_id: ""

# Firewall backend: "simulated" (safe demo, no real blocking)
# or "iptables" (Linux only, real stateful block with auto-expiry)
firewall_backend: simulated

# Block expiry seconds (stateful: blocks auto-expire)
block_default_duration: 600

# Human-gate time-box.
#   hold          = wait for a person indefinitely (recommended: containment is human-gated)
#   escalate      = after N seconds, mark it escalated and notify loudly
#   auto_execute  = after N seconds, perform the action WITHOUT approval (NOT recommended —
#                   it defeats the human gate and will fire on false positives)
approval_timeout_seconds: 60
approval_timeout_action: hold

# Accept alerts from any SIEM; optional shared secret check
webhook_secret: ""
