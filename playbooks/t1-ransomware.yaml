# T1 — Ransomware / encryption pattern
# DESIGN: containment is a disruptive action — a wrong auto-block can cut off a
# legitimate host/device (especially in a hospital). So block_ip QUEUES for
# human approval (one click) instead of running unattended. notify + evidence
# still run automatically (safe, reversible); the approval is time-boxed by
# approval_timeout_seconds so it never waits forever.
name: t1-ransomware
description: แรนซัมแวร์ — เก็บหลักฐาน + ขออนุมัติบล็อก IP (มีกำหนดหมดอายุ) และแยกโฮสต์
enabled: true
gate: human
locks:
  # Safety envelope: host isolation can never be set to auto by the customer.
  # The form shows แยกโฮสต์ as locked (🔒) and it stays ต้องอนุมัติ always.
  isolate_host: human
when:
  # Scenario selection by the SIEM's OWN MITRE classification. No detection content is
  # installed into Wazuh — its stock rules already tag both halves of an encryption attack:
  #   553 File deleted     -> T1070.004, T1485 (Data Destruction)      level 7
  #   550 Checksum changed -> T1565.001 (Stored Data Manipulation)     level 7
  # so this matches vanilla Wazuh, and any other SIEM that tags the same techniques.
  # T1486 is listed for SIEMs that classify encryption directly.
  #
  # Stated plainly: with no upstream correlation rule the SOAR now sees EVERY tagged file
  # event rather than one verdict. That is the deliberate trade for having no per-SIEM
  # detection content, and mini-SOAR absorbs it by folding identical notifications and
  # aggregating approvals. It costs precision — an administrator's bulk delete looks the
  # same — which is what canary files are for.
  mitre:
    - T1485      # Data Destruction - originals and shadow copies deleted
    - T1565.001  # Stored Data Manipulation - files rewritten in place
    - T1486      # Data Encrypted for Impact - for SIEMs that classify encryption
  min_severity: 7
steps:
  - action: notify
    params:
      template: "🚨 แจ้งเตือนแรนซัมแวร์: {title} ที่โฮสต์ {host} — เก็บหลักฐานแล้ว รออนุมัติแยกโฮสต์"
  - action: preserve_evidence
    params: {}
  # Containment for ransomware is the HOST, not an IP. A FIM-based ransomware alert
  # carries no source address, so a block_ip step here can only ever queue a
  # meaningless approval ("บล็อกไอพี  " with an empty address) and mislead the operator
  # about what is about to happen. Removed after the end-to-end test showed it.
  - action: isolate_host
    params:
      host_field: host
    gate: human
  - action: audit
    params: {}
