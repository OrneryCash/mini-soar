# T1 — Ransomware / encryption pattern
# DESIGN: containment is a disruptive action — a wrong auto-block can cut off a
# legitimate host/device (especially in a hospital). So block_ip QUEUES for
# human approval (one click) instead of running unattended. notify + evidence
# still run automatically (safe, reversible); the approval is time-boxed by
# approval_timeout_seconds so it never waits forever.
name: t1-ransomware
description: แรนซัมแวร์ — เก็บหลักฐาน + ขออนุมัติบล็อก IP (มีกำหนดหมดอายุ) และแยกโฮสต์
enabled: true
gate: human
locks:
  # Safety envelope: host isolation can never be set to auto by the customer.
  # The form shows แยกโฮสต์ as locked (🔒) and it stays ต้องอนุมัติ always.
  isolate_host: human
when:
  pattern: 'ransom|encrypt|mass file change|wannacry|lockbit|notpetya|\.encrypted|\.locked'
steps:
  - action: notify
    params:
      template: "🚨 แจ้งเตือนแรนซัมแวร์: {title} ที่โฮสต์ {host} — เก็บหลักฐานแล้ว รออนุมัติแยกโฮสต์"
  - action: preserve_evidence
    params: {}
  # Containment for ransomware is the HOST, not an IP. A FIM-based ransomware alert
  # carries no source address, so a block_ip step here can only ever queue a
  # meaningless approval ("บล็อกไอพี  " with an empty address) and mislead the operator
  # about what is about to happen. Removed after the end-to-end test showed it.
  - action: isolate_host
    params:
      host_field: host
    gate: human
  - action: audit
    params: {}
