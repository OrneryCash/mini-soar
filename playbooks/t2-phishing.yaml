# Mini-SOAR playbook — แก้ไขผ่านฟอร์มภาษาไทย (Thai UI)
# แก้ไขแต่ละครั้งจะบันทึกเป็น YAML ไฟล์โดยตรง — single source of truth
name: t2-phishing
description: ฟิชชิง / ไลน์ฟิชชิง — ตรวจสอบ IOC แล้วแจ้งเตือน
enabled: true
gate: human
when:
  pattern: phish|line.*scam|credential harvest|suspicious url|malicious link|fake login
steps:
- action: notify
  params:
    template: '⚠️ ฟิชชิง: {title} — URL: {url} ผู้ใช้: {user}'
- action: preserve_evidence
  params: {}
- action: block_ip
  gate: human
  params:
    ip_field: src_ip
    duration: 1800
- action: audit
  params: {}
