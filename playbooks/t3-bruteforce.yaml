# Mini-SOAR playbook — แก้ไขผ่านฟอร์มภาษาไทย (Thai UI)
# แก้ไขแต่ละครั้งจะบันทึกเป็น YAML ไฟล์โดยตรง — single source of truth
name: t3-bruteforce
description: บรู๊ตฟอร์ซ SSH/RDP — บล็อก IP 30 นาที + ยกเว้น IP เครื่องภายใน (แก้ไขโดยลูกค้า)
enabled: true
gate: human
when:
  pattern: (brute|failed\ login|ssh|rdp)
  keywords:
  - brute
  - failed login
  - ssh
  - rdp
  not_ip:
  - 10.99.99.99
steps:
- action: notify
  params:
    template: '⚠️ บรู๊ตฟอร์ซ: {title} จาก IP {src_ip}'
- action: block_ip
  gate: human
  params:
    ip_field: src_ip
    duration: 1800
- action: audit
  params: {}
