<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-SOAR — {{template "title" .}}</title>
  <script>
    // Shared helpers — defined in <head> so page scripts (which run before
    // the end-of-body script) can use them.
    function localTime(iso, withDate) {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const t = d.toLocaleTimeString('th-TH', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
      if (!withDate) return t;
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      return `${dd}/${mm} ${t}`;
    }
    function sevBadge(n) {
      n = Number(n) || 0;
      const cls = n >= 13 ? 'crit' : n >= 10 ? 'high' : n >= 6 ? 'med' : 'low';
      const lbl = n >= 13 ? 'วิกฤต' : n >= 10 ? 'สูง' : n >= 6 ? 'กลาง' : 'ต่ำ';
      return `<span class="sev ${cls}">${lbl}</span>`;
    }
    function convertTimes(withDate) {
      document.querySelectorAll('.time[data-ts]').forEach(td => {
        if (!td.title) td.title = td.dataset.ts;  // full ISO on hover
        td.textContent = localTime(td.dataset.ts, withDate);
      });
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif; background: #f3f6fa; color: #1a2233; }
    header { background: #0d2b4e; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    header .logo { font-size: 20px; font-weight: 700; }
    header nav a { color: #bcd4ee; text-decoration: none; margin-right: 16px; font-size: 15px; padding: 6px 10px; border-radius: 8px; }
    header nav a:hover { color: #fff; background: rgba(255,255,255,.08); }
    header nav a.active { color: #fff; background: rgba(255,255,255,.14); font-weight: 600; }
    .badge { display: inline-block; min-width: 20px; padding: 1px 7px; border-radius: 12px; background: #e5484d; color: #fff; font-size: 12px; font-weight: 700; text-align: center; vertical-align: middle; margin-left: 4px; }
    main { max-width: 1180px; margin: 24px auto; padding: 0 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card .num { font-size: 28px; font-weight: 700; color: #0d2b4e; }
    .card .lbl { font-size: 13px; color: #5a6b82; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    th, td { text-align: left; padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #eef2f7; vertical-align: middle; }
    th { background: #eef3f9; color: #33415c; font-weight: 600; white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; white-space: nowrap; }
    .tag.auto { background: #e3f5e8; color: #1e7a3c; }
    .tag.human { background: #fdeeda; color: #a05a00; }
    .tag.on { background: #e3f5e8; color: #1e7a3c; }
    .tag.off { background: #fde8e8; color: #b02a2a; }
    .sev { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .sev.crit { background: #fde3e3; color: #b02a2a; }
    .sev.high { background: #fdeeda; color: #b45309; }
    .sev.med { background: #fef6d8; color: #8a6d00; }
    .sev.low { background: #e8eef7; color: #4a5a74; }
    .siem { display: inline-block; background: #e8eef7; color: #33415c; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .btn { border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600; white-space: nowrap; }
    .btn + .btn { margin-left: 6px; }
    .btn-approve { background: #1e7a3c; color: #fff; }
    .btn-approve:hover { background: #17632f; }
    .btn-deny { background: #b02a2a; color: #fff; }
    .btn-deny:hover { background: #8f1f1f; }
    .switch { position: relative; width: 44px; height: 24px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #c3ccd8; border-radius: 24px; transition: .2s; }
    .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #1e7a3c; }
    input:checked + .slider:before { transform: translateX(20px); }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #5a6b82; }
    .nowrap { white-space: nowrap; }
    .empty { color: #8a97ab; text-align: center; padding: 30px; }
    .pill { display: inline-block; background: #e8eef7; color: #33415c; border-radius: 20px; padding: 2px 10px; font-size: 12px; margin: 2px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .filter { border: 1px solid #d4dde8; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-family: inherit; width: 260px; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2fbf71; margin-right: 6px; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .live { color: #5a6b82; font-size: 13px; }
    /* Modal + form styles */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(13,27,43,.55); z-index: 100; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; max-width: 720px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 0; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #eef2f7; }
    .modal-head h3 { font-size: 18px; color: #0d2b4e; }
    .modal-close { border: none; background: none; font-size: 22px; cursor: pointer; color: #5a6b82; line-height: 1; }
    .modal-body { padding: 20px 24px; max-height: 85vh; overflow-y: auto; }
    .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid #eef2f7; flex-wrap: wrap; }
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-weight: 600; font-size: 14px; color: #33415c; margin-bottom: 6px; }
    .form-row .hint { font-size: 12px; color: #8a97ab; font-weight: 400; margin-left: 6px; }
    .form-row input[type=text], .form-row textarea, .form-row select {
      width: 100%; border: 1px solid #d4dde8; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit;
    }
    .form-row input[type=text]:focus, .form-row textarea:focus, .form-row select:focus { outline: 2px solid #9dc3ec; border-color: #0d2b4e; }
    .form-row textarea { resize: vertical; min-height: 54px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .form-grid .form-row.full { grid-column: 1 / -1; }
    .radio-group { display: flex; gap: 18px; align-items: center; }
    .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; cursor: pointer; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; border: 1px solid #d4dde8; border-radius: 8px; padding: 8px; min-height: 44px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: #e8eef7; color: #33415c; border-radius: 16px; padding: 3px 10px; font-size: 13px; }
    .chip button { border: none; background: none; color: #8a97ab; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
    .chip button:hover { color: #b02a2a; }
    .chips input { border: none; outline: none; flex: 1; min-width: 120px; font-size: 14px; font-family: inherit; padding: 4px; }
    .step-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding-right: 6px; }
    .step-row { display: flex; align-items: center; gap: 10px; font-weight: 400; margin: 0; cursor: pointer; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }
    .step-row:hover { border-color: #c9d6e6; background: #fafcfe; }
    .step-row.locked { background: #f8fafc; color: #8a97ab; cursor: not-allowed; }
    .step-num { width: 24px; height: 24px; min-width: 24px; border-radius: 50%; background: #0d2b4e; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
    .step-label { flex: 1; }
    .act-order { display: inline-flex; flex-direction: column; gap: 2px; }
    .act-order button { border: none; background: #e8eef7; color: #33415c; width: 20px; height: 13px; font-size: 10px; line-height: 1; cursor: pointer; border-radius: 3px; padding: 0; }
    .act-order button:hover { background: #dbe5f1; }
    .step-del { border: none; background: none; color: #8a97ab; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
    .step-del:hover { background: #fde8e8; color: #b02a2a; }
    .step-overflow { font-size: 12px; color: #8a97ab; margin-top: 4px; display: none; }
    .add-step-row { margin-top: 8px; }
    .add-step-row select { width: 100%; border: 1px dashed #c9d6e6; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; background: #fafcfe; color: #33415c; cursor: pointer; }
    .add-step-row select:disabled { color: #b6c2d2; cursor: default; }
    .preset-btns { margin-left: 6px; }
    .preset { border: 1px solid #c9d6e6; background: #fff; color: #0d2b4e; border-radius: 14px; padding: 2px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .preset:hover { background: #eef4fb; }
    #sample-alert { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.4; }
    .btn-primary { background: #0d2b4e; color: #fff; }
    .btn-primary:hover { background: #123a68; }
    .btn-ghost { background: #e8eef7; color: #33415c; }
    .btn-ghost:hover { background: #dbe5f1; }
    .btn-test { background: #f0f4fa; color: #0d2b4e; border: 1px solid #c9d6e6; }
    .btn-danger { background: #fff; color: #b02a2a; border: 1px solid #f0c4c4; }
    .btn-danger:hover { background: #fdf0f0; }
    .errors { background: #fdf0f0; border: 1px solid #f0c4c4; color: #b02a2a; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
    .errors ul { margin: 0; padding-left: 18px; }
    .preview { background: #f6f9fd; border: 1px dashed #c9d6e6; border-radius: 10px; padding: 14px; font-size: 13px; color: #33415c; margin-top: 12px; display: none; }
    .preview .pv-title { font-weight: 700; margin-bottom: 8px; color: #0d2b4e; }
    .preview .pv-step { padding: 5px 0; border-bottom: 1px dashed #dfe8f2; }
    .preview .pv-step:last-child { border-bottom: none; }
    .lock-note { font-size: 12px; color: #a05a00; background: #fdeeda; border-radius: 6px; padding: 5px 10px; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🛡️ Mini-SOAR</div>
    <nav>
      <a href="/" data-nav="/">แดชบอร์ด</a>
      <a href="/playbooks" data-nav="/playbooks">เพลย์บุ๊ก</a>
      <a href="/approvals" data-nav="/approvals">รออนุมัติ <span id="nav-pending" class="badge" style="display:none">0</span></a>
      <a href="/audit" data-nav="/audit">ประวัติการทำงาน</a>
    </nav>
    <span class="live" style="margin-left:auto"><span class="live-dot"></span>ระบบออนไลน์</span>
  </header>
  <main>
    {{template "content" .}}
  </main>
  <script>
    // Highlight the current page in the nav
    document.querySelectorAll('header nav a[data-nav]').forEach(a => {
      if (location.pathname.startsWith(a.dataset.nav) && (a.dataset.nav !== '/' || location.pathname === '/')) {
        a.classList.add('active');
      }
    });
    // Live pending-approval badge (every 3s)
    async function refreshBadge() {
      try {
        const r = await fetch('/api/stats');
        const s = await r.json();
        const el = document.getElementById('nav-pending');
        el.textContent = s.pending;
        el.style.display = s.pending > 0 ? 'inline-block' : 'none';
      } catch (e) { /* server restarting — try again next tick */ }
    }
    refreshBadge();
    setInterval(refreshBadge, 3000);
  </script>
</body>
</html>
